version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/cockpit-git-server"
    schedule:
      interval: "daily"
      time: "22:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      eslint:
        patterns:
          - "eslint*"
      esbuild:
        patterns:
          - "esbuild*"
      patternfly:
        patterns:
          - "@patternfly*"
      react:
        patterns:
          - "react*"
      stylelint:
        patterns:
          - "stylelint*"
      types:
        patterns:
          - "@types*"
          - "types*"

    ignore:
      # https://github.com/cockpit-project/cockpit/issues/21151
      - dependency-name: "sass"
        versions: [">=1.80.0", "2.x"]

      # needs to be done in Cockpit first
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major"]

      # PF5 requires React 18
      - dependency-name: "*react*"
        update-types: ["version-update:semver-major"]

      # These apps configure ESLint through .eslintrc.json, which ESLint 9
      # dropped in favour of flat config; the plugins move in lockstep, so the
      # whole eslint* family has to stay on the 8.x generation.
      - dependency-name: "eslint*"
        update-types: ["version-update:semver-major"]

