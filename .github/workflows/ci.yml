name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [cockpit-git-server, cockpit-backup, cockpit-security, cockpit-openssh, cockpit-wireguard, cockpit-firewall, cockpit-samba]
        node-version: [22, 24]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y make gettext

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Fetch Cockpit build libraries
        run: make pkg/lib/cockpit-po-plugin.js

      - name: Build
        run: NODE_ENV=production ./build.js

      - name: Verify dist output
        run: |
          test -f dist/manifest.json
          test -f dist/index.html
          test -f dist/index.js.gz
          test -f dist/index.css.gz

      - name: Upload build artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist/

  unit-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [cockpit-git-server, cockpit-backup, cockpit-security, cockpit-wireguard, cockpit-firewall, cockpit-samba]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Unit tests
        run: npm test

  samba-integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cockpit-samba
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Samba
        run: sudo apt-get update && sudo apt-get install -y samba

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Apply flow against real testparm and smbd
        run: npm run test:samba

  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [cockpit-git-server, cockpit-backup, cockpit-security, cockpit-openssh, cockpit-wireguard, cockpit-firewall, cockpit-samba]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: ESLint
        run: npm run eslint

      - name: Stylelint
        run: npm run stylelint
